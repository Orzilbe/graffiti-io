<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Mix Master</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    :root { --pc: #FF2D78; }

    html, body {
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      background: #0d0d0d; touch-action: none; overflow: hidden;
    }

    /* ── HUD bar ── */
    #hud {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; flex-shrink: 0;
      background: rgba(0,0,0,.65);
      border-bottom: 2px solid var(--pc);
      gap: 10px;
    }
    #hud-logo { height: 36px; width: auto; flex-shrink: 0; }
    #hud-name {
      font-family: 'Permanent Marker', cursive;
      font-size: 1.25rem; color: var(--pc); flex: 1;
    }
    #hud-stats {
      font-family: 'Boogaloo', sans-serif;
      font-size: 1.1rem; color: #ccc; text-align: right;
    }
    #hud-rank { color: var(--pc); font-size: 1.2rem; font-family: 'Permanent Marker', cursive; }

    /* ── D-pad ── */
    #dpad {
      flex: 1; display: grid;
      grid-template-columns: 1fr .5fr 1fr;
      grid-template-rows:    1fr .5fr 1fr;
      padding: 12px; gap: 8px;
    }
    .corner {
      border-radius: 16px; background: #111;
      border: 1px solid #1c1c1c;
    }
    .dpad-center {
      border-radius: 50%; background: #161616;
      border: 2px solid #252525;
      display: flex; align-items: center; justify-content: center;
    }
    .dpad-btn {
      display: flex; align-items: center; justify-content: center;
      border-radius: 18px; background: #161616;
      border: 2px solid #272727; font-size: 2.6rem; color: #fff;
      user-select: none; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .07s, transform .07s, border-color .07s;
    }
    .dpad-btn.active {
      background: var(--pc); border-color: var(--pc); transform: scale(.93);
    }

    /* ── Overlay screens ── */
    .screen {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(8,8,8,.93);
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; touch-action: none;
    }
    .screen.show { display: flex; }

    .screen-title {
      font-family: 'Permanent Marker', cursive;
      font-size: 2.8rem; text-align: center; line-height: 1.2;
    }
    .screen-sub {
      font-family: 'Boogaloo', sans-serif;
      font-size: 1.4rem; color: #bbb; text-align: center;
    }

    #lobby-screen .screen-title { color: var(--pc); text-shadow: 0 0 20px var(--pc); }
    #go-screen    .screen-title { color: #76FF03;   text-shadow: 0 0 24px #76FF03; font-size: 4rem; }
    #death-screen .screen-title { color: #FF6D00;   text-shadow: 0 0 20px #FF6D00; }
    #end-screen   .screen-title { color: #FF6D00; }
    #end-winner { font-family: 'Boogaloo', sans-serif; font-size: 1.7rem; text-align: center; }
  </style>
</head>
<body>

  <!-- HUD -->
  <div id="hud">
    <img src="/mixMaster.png" id="hud-logo" alt="Mix Master" />
    <div id="hud-name">P?</div>
    <div id="hud-stats">
      <span id="hud-rank">#–</span>
      &nbsp;|&nbsp;
      <span id="hud-pct">0%</span>
    </div>
  </div>

  <!-- D-pad grid: 3×3, corners decorative, center = direction dot -->
  <div id="dpad">
    <div class="corner"></div>
    <div class="dpad-btn" data-dir="up">▲</div>
    <div class="corner"></div>

    <div class="dpad-btn" data-dir="left">◀</div>
    <div class="dpad-center">
      <svg width="22" height="22" viewBox="0 0 22 22">
        <circle cx="11" cy="11" r="7" fill="var(--pc)" opacity=".55"/>
      </svg>
    </div>
    <div class="dpad-btn" data-dir="right">▶</div>

    <div class="corner"></div>
    <div class="dpad-btn" data-dir="down">▼</div>
    <div class="corner"></div>
  </div>

  <!-- Screens -->
  <div id="lobby-screen" class="screen show">
    <div class="screen-title" id="lobby-player-name">PLAYER ?</div>
    <div class="screen-sub">Waiting for host…</div>
  </div>

  <div id="go-screen" class="screen">
    <div class="screen-title">GO!</div>
  </div>

  <div id="death-screen" class="screen">
    <div class="screen-title">SPRAYED!</div>
    <div class="screen-sub">Back in <span id="countdown">3</span>s…</div>
  </div>

  <div id="end-screen" class="screen">
    <div class="screen-title">GAME OVER</div>
    <div id="end-winner"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/controller.js"></script>
</body>
</html>
