<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Tap Frenzy — Controller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Boogaloo&display=swap" rel="stylesheet" />
  <script src="/socket.io/socket.io.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root { --color: #FF2D78; }

    body {
      font-family: 'Boogaloo', sans-serif;
      background: #0f0f0f;
      color: #fff;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* ── Top bar ──────────────────────────────────────────── */
    #topbar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 10px;
      flex-shrink: 0;
    }
    #username {
      font-family: 'Permanent Marker', cursive;
      font-size: 1.2rem;
      color: var(--color);
      text-shadow: 0 0 12px var(--color);
      max-width: 55%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    #timer-display {
      font-family: 'Permanent Marker', cursive;
      font-size: 2.4rem;
      line-height: 1;
      color: #fff;
      transition: color .2s;
    }
    #timer-display.urgent {
      color: #FF2D78;
      text-shadow: 0 0 20px #FF2D78;
    }

    /* ── Tap count ────────────────────────────────────────── */
    #tap-counter {
      text-align: center;
      flex-shrink: 0;
      padding: 0 20px 8px;
    }
    #tap-count {
      font-family: 'Permanent Marker', cursive;
      font-size: 5rem;
      line-height: 1;
      color: var(--color);
      text-shadow: 0 0 24px var(--color);
      transition: transform .06s ease-out;
    }
    #tap-count.pop { transform: scale(1.25); }
    .tap-label {
      font-size: 1rem;
      color: rgba(255,255,255,.4);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    /* ── TAP button ───────────────────────────────────────── */
    #tap-area {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px 32px;
    }
    #tap-btn {
      width: min(80vw, 300px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 4px solid var(--color);
      background: color-mix(in srgb, var(--color) 18%, transparent);
      box-shadow: 0 0 48px color-mix(in srgb, var(--color) 40%, transparent),
                  inset 0 0 32px color-mix(in srgb, var(--color) 10%, transparent);
      font-family: 'Permanent Marker', cursive;
      font-size: clamp(1.8rem, 8vw, 2.8rem);
      color: #fff;
      cursor: pointer;
      transition: transform .05s, box-shadow .05s;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    #tap-btn:active,
    #tap-btn.tap-anim {
      transform: scale(0.88);
      box-shadow: 0 0 72px color-mix(in srgb, var(--color) 70%, transparent),
                  inset 0 0 48px color-mix(in srgb, var(--color) 25%, transparent);
    }

    /* ── State overlays ───────────────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: rgba(10,10,10,.95);
      z-index: 50;
    }
    .overlay-title {
      font-family: 'Permanent Marker', cursive;
      font-size: 2rem;
      text-align: center;
      padding: 0 24px;
    }
    .overlay-sub {
      color: rgba(255,255,255,.45);
      font-size: 1.1rem;
      text-align: center;
      padding: 0 32px;
      line-height: 1.5;
    }
    #spinner {
      width: 40px; height: 40px;
      border: 4px solid rgba(255,255,255,.15);
      border-top-color: var(--color);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Game Over ────────────────────────────────────────── */
    #go-placement {
      font-family: 'Permanent Marker', cursive;
      font-size: 5rem;
    }
    #go-taps {
      color: rgba(255,255,255,.5);
      font-size: 1.2rem;
    }
    #go-points {
      font-family: 'Permanent Marker', cursive;
      font-size: 2rem;
      color: #FF2D78;
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div id="topbar">
    <span id="username">Player</span>
    <span id="timer-display">30</span>
  </div>

  <!-- Tap count -->
  <div id="tap-counter">
    <div id="tap-count">0</div>
    <div class="tap-label">taps!</div>
  </div>

  <!-- Main tap button -->
  <div id="tap-area">
    <button id="tap-btn" aria-label="Tap">TAP!</button>
  </div>

  <!-- Connecting overlay -->
  <div class="overlay" id="overlay-connecting">
    <div id="spinner"></div>
    <p class="overlay-title" style="color: var(--color)">Connecting…</p>
  </div>

  <!-- Waiting overlay -->
  <div class="overlay" id="overlay-waiting" style="display:none">
    <p class="overlay-title" style="color: var(--color)">YOU'RE IN! 🎨</p>
    <p class="overlay-sub">Waiting for the host to start the game…</p>
  </div>

  <!-- Game Over overlay -->
  <div class="overlay" id="overlay-gameover" style="display:none">
    <div id="go-placement"></div>
    <div id="go-taps"></div>
    <div id="go-points"></div>
    <p class="overlay-sub">Scan the QR code to play again!</p>
  </div>

  <script src="/tap-frenzy/controller.js"></script>
</body>
</html>
