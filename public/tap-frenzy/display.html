<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tap Frenzy — Mix Master</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Boogaloo&display=swap" rel="stylesheet" />
  <script src="/socket.io/socket.io.js"></script>
  <script src="/tap-frenzy/config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Boogaloo', sans-serif;
      background-color: #111;
      background-image:
        repeating-linear-gradient(
          0deg, transparent, transparent 25px, rgba(255,255,255,.03) 25px, rgba(255,255,255,.03) 26px
        ),
        repeating-linear-gradient(
          90deg, transparent, transparent 63px, rgba(255,255,255,.03) 63px, rgba(255,255,255,.03) 64px
        );
      color: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────────────── */
    #header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 18px 32px 10px;
      flex-shrink: 0;
      position: relative;
    }
    .logo {
      height: 52px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(255,45,120,.5));
    }
    #timer-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0,0,0,.5);
      border: 2px solid rgba(255,255,255,.15);
      border-radius: 14px;
      padding: 6px 24px;
      min-width: 110px;
    }
    #timer {
      font-family: 'Permanent Marker', cursive;
      font-size: 3rem;
      line-height: 1;
      color: #fff;
      transition: color .3s;
    }
    #timer.urgent { color: #FF2D78; text-shadow: 0 0 20px #FF2D78; }
    .timer-label {
      font-size: .8rem;
      color: rgba(255,255,255,.35);
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    #game-title {
      font-family: 'Permanent Marker', cursive;
      font-size: 2rem;
      color: #00E5FF;
      text-shadow: 0 0 20px #00E5FF88;
      letter-spacing: .05em;
    }

    /* ── Layout ─────────────────────────────────────────────── */
    #layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 0;
    }
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 24px 24px;
      position: relative;
      overflow: hidden;
    }

    /* ── Player cards ───────────────────────────────────────── */
    #players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }
    .player-card {
      background: rgba(255,255,255,.04);
      border: 2px solid transparent;
      border-radius: 20px;
      padding: 24px 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: box-shadow .15s;
    }
    .card-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .card-name {
      font-family: 'Permanent Marker', cursive;
      font-size: 1.4rem;
      truncate: ellipsis;
      overflow: hidden;
      white-space: nowrap;
      max-width: 60%;
    }
    .card-taps {
      font-family: 'Permanent Marker', cursive;
      font-size: 3.2rem;
      line-height: 1;
    }
    .card-taps-label {
      font-size: .85rem;
      color: rgba(255,255,255,.4);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .progress-track {
      height: 18px;
      background: rgba(255,255,255,.08);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
      width: 0%;
      transition: width .12s ease-out;
    }

    /* ── Lobby overlay ──────────────────────────────────────── */
    #lobby {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: rgba(17,17,17,.85);
      backdrop-filter: blur(4px);
      border-radius: 0;
      z-index: 10;
    }
    #waiting-msg {
      font-family: 'Permanent Marker', cursive;
      font-size: 2rem;
      color: rgba(255,255,255,.35);
      letter-spacing: .06em;
      text-align: center;
    }
    #need-more {
      font-size: 1rem;
      color: rgba(255,255,255,.25);
      display: none;
    }
    #start-btn {
      display: none;
      font-family: 'Permanent Marker', cursive;
      font-size: 2rem;
      padding: 18px 60px;
      border-radius: 18px;
      border: none;
      cursor: pointer;
      color: #fff;
      background: #FF2D78;
      box-shadow: 0 0 48px rgba(255,45,120,.6);
      transition: transform .1s, box-shadow .1s;
    }
    #start-btn:hover  { transform: scale(1.04); }
    #start-btn:active { transform: scale(0.96); }

    /* ── Game Over overlay ──────────────────────────────────── */
    #gameover {
      display: none;
      position: absolute;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: rgba(10,10,10,.92);
      backdrop-filter: blur(6px);
      z-index: 20;
    }
    .go-title {
      font-family: 'Permanent Marker', cursive;
      font-size: 3.5rem;
      color: #FF2D78;
      text-shadow: 0 0 32px #FF2D78;
    }
    .go-table {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 380px;
    }
    .go-row {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255,255,255,.05);
      border-radius: 14px;
      padding: 14px 20px;
    }
    .go-medal { font-size: 1.8rem; width: 36px; text-align: center; flex-shrink: 0; }
    .go-name  { font-family: 'Permanent Marker', cursive; font-size: 1.3rem; flex: 1; }
    .go-taps  { font-size: 1rem; color: rgba(255,255,255,.5); flex-shrink: 0; }
    .go-pts   { font-family: 'Permanent Marker', cursive; font-size: 1.3rem; flex-shrink: 0; color: #FF2D78; }

    /* ── Sidebar ────────────────────────────────────────────── */
    #sidebar {
      width: 30%;
      max-width: 320px;
      min-width: 220px;
      flex-shrink: 0;
      background: rgba(0,0,0,.35);
      border-left: 1px solid rgba(255,255,255,.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #sidebar-title {
      font-family: 'Permanent Marker', cursive;
      font-size: 1.1rem;
      text-align: center;
      padding: 20px 16px 14px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      color: #FF2D78;
      text-shadow: 0 0 16px #FF2D7888;
      flex-shrink: 0;
    }
    #leaderboard-rows {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .lb-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.06);
    }
    .lb-rank  { font-family: 'Permanent Marker', cursive; font-size: .85rem; width: 22px; text-align: center; flex-shrink: 0; }
    .lb-name  { flex: 1; font-size: .9rem; color: rgba(255,255,255,.8); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .lb-score { font-family: 'Permanent Marker', cursive; font-size: .85rem; color: rgba(255,255,255,.5); flex-shrink: 0; }

    #lb-empty {
      font-size: .9rem;
      color: rgba(255,255,255,.2);
      text-align: center;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <div id="header">
    <img src="/mixMaster.png" alt="Mix Master" class="logo" />
    <div id="game-title">TAP FRENZY ⚡</div>
    <div id="timer-wrap">
      <span id="timer">30</span>
      <span class="timer-label">seconds</span>
    </div>
  </div>

  <div id="layout">
    <div id="main">
      <div id="players-grid"></div>

      <!-- Lobby overlay -->
      <div id="lobby">
        <p id="waiting-msg">WAITING FOR PLAYERS…</p>
        <p id="need-more"></p>
        <button id="start-btn">START GAME ⚡</button>
      </div>

      <!-- Game over overlay -->
      <div id="gameover">
        <h2 class="go-title">GAME OVER!</h2>
        <div class="go-table" id="go-table"></div>
      </div>
    </div>

    <aside id="sidebar">
      <div id="sidebar-title">KINGS OF THE WALL 👑</div>
      <div id="leaderboard-rows">
        <p id="lb-empty">Loading…</p>
      </div>
    </aside>
  </div>

  <script src="/tap-frenzy/game.js"></script>
</body>
</html>
