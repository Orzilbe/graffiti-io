<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Last One Standing — Controller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Boogaloo&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:    #FF2D78;
      --cyan:    #00E5FF;
      --green:   #76FF03;
      --orange:  #FF6D00;
      --bg:      #111118;
      --surface: #1a1a28;
      --player:  #FF2D78;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: #fff;
      font-family: 'Boogaloo', cursive;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    /* ── Screens ── */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem;
      text-align: center;
      transition: opacity .3s;
    }

    .screen.hidden { opacity: 0; pointer-events: none; }

    /* ── Join screen ── */
    #screen-join h1 {
      font-family: 'Permanent Marker', cursive;
      font-size: 2rem;
      color: var(--pink);
      text-shadow: 0 0 30px rgba(255,45,120,.6);
    }

    #screen-join p {
      color: rgba(255,255,255,.5);
      font-size: 1.1rem;
    }

    #username-input {
      width: 100%;
      max-width: 280px;
      padding: .9rem 1.2rem;
      border-radius: 1rem;
      border: 2px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.06);
      color: #fff;
      font-family: 'Permanent Marker', cursive;
      font-size: 1.2rem;
      text-align: center;
      outline: none;
    }

    #username-input:focus { border-color: var(--cyan); }

    #join-btn {
      width: 100%;
      max-width: 280px;
      padding: 1rem;
      border-radius: 1rem;
      border: none;
      background: var(--pink);
      color: #fff;
      font-family: 'Permanent Marker', cursive;
      font-size: 1.4rem;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255,45,120,.5);
      transition: transform .15s;
      touch-action: manipulation;
    }
    #join-btn:active { transform: scale(.96); }

    /* ── Lobby / waiting screen ── */
    #screen-lobby h2 {
      font-family: 'Permanent Marker', cursive;
      font-size: 1.8rem;
    }

    #screen-lobby .you-re-in {
      font-family: 'Permanent Marker', cursive;
      font-size: 2.2rem;
      text-shadow: 0 0 30px currentColor;
    }

    .waiting-msg {
      color: rgba(255,255,255,.4);
      font-size: 1.1rem;
    }

    #players-list {
      width: 100%;
      max-width: 300px;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      margin-top: .5rem;
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .6rem 1rem;
      border-radius: .75rem;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
    }

    .player-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .player-row-name {
      font-size: 1rem;
      color: rgba(255,255,255,.8);
    }

    /* ── Game screen ── */
    #screen-game {
      gap: 2rem;
    }

    #tap-hint {
      font-family: 'Permanent Marker', cursive;
      font-size: 1.5rem;
      color: rgba(255,255,255,.6);
      min-height: 2rem;
      letter-spacing: .05em;
    }

    #tap-status {
      font-size: 1rem;
      color: rgba(255,255,255,.35);
      min-height: 1.4rem;
    }

    .tap-btn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: none;
      font-family: 'Permanent Marker', cursive;
      font-size: 2.5rem;
      cursor: pointer;
      transition: transform .1s, box-shadow .2s, background .2s;
      touch-action: manipulation;
    }

    .tap-btn:active { transform: scale(.93); }

    .tap-btn.tap-wait {
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.25);
      box-shadow: none;
      cursor: not-allowed;
    }

    .tap-btn.tap-go {
      background: var(--green);
      color: #111;
      box-shadow: 0 0 60px rgba(118,255,3,.7), 0 0 120px rgba(118,255,3,.3);
      animation: goGlow .4s ease-out;
    }

    .tap-btn.tap-fake {
      background: #cc0000;
      color: #fff;
      box-shadow: 0 0 60px rgba(200,0,0,.7);
    }

    @keyframes goGlow {
      0%   { transform: scale(.85); }
      60%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    /* ── Eliminated screen ── */
    #screen-eliminated h2 {
      font-family: 'Permanent Marker', cursive;
      font-size: 2.5rem;
      color: var(--pink);
      text-shadow: 0 0 40px rgba(255,45,120,.7);
    }

    #placement-text {
      font-family: 'Permanent Marker', cursive;
      font-size: 1.5rem;
      color: rgba(255,255,255,.6);
    }

    /* ── Winner screen ── */
    #screen-winner {
      gap: 1rem;
    }

    #winner-text {
      font-family: 'Permanent Marker', cursive;
      font-size: 3rem;
      text-shadow: 0 0 60px currentColor;
      animation: winnerPop .5s cubic-bezier(.22,1,.36,1);
    }

    @keyframes winnerPop {
      0%   { transform: scale(.5); opacity: 0; }
      60%  { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ── Full-lobby message ── */
    #screen-full h2 {
      font-family: 'Permanent Marker', cursive;
      font-size: 2rem;
      color: var(--orange);
    }

    #screen-full p { color: rgba(255,255,255,.5); }

    .hidden { opacity: 0 !important; pointer-events: none !important; }
  </style>
</head>
<body>

  <!-- Join -->
  <div id="screen-join" class="screen">
    <h1>LAST ONE STANDING</h1>
    <p>Enter your name to join the battle</p>
    <input id="username-input" type="text" placeholder="Your name" maxlength="16"
           autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" />
    <button id="join-btn">JOIN 🎨</button>
  </div>

  <!-- Lobby / waiting -->
  <div id="screen-lobby" class="screen hidden">
    <div class="you-re-in" id="you-re-in-text">YOU'RE IN! 🎨</div>
    <div class="waiting-msg">Waiting for host to start…</div>
    <div id="players-list"></div>
  </div>

  <!-- Game: tap screen -->
  <div id="screen-game" class="screen hidden">
    <div id="tap-hint">Get ready…</div>
    <button class="tap-btn tap-wait" id="tap-btn" disabled>🎨</button>
    <div id="tap-status"></div>
  </div>

  <!-- Eliminated -->
  <div id="screen-eliminated" class="screen hidden">
    <div style="font-size:4rem">💥</div>
    <h2>SPRAYED OUT!</h2>
    <div id="placement-text"></div>
  </div>

  <!-- Winner -->
  <div id="screen-winner" class="screen hidden">
    <div style="font-size:5rem">🏆</div>
    <div id="winner-text">YOU WIN!</div>
  </div>

  <!-- Lobby full -->
  <div id="screen-full" class="screen hidden">
    <div style="font-size:3rem">🚫</div>
    <h2>LOBBY FULL</h2>
    <p>This round is full — try again after the game ends.</p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="controller.js"></script>
</body>
</html>
