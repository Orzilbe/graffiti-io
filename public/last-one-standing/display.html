<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Last One Standing — Mix Master</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Boogaloo&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:   #FF2D78;
      --cyan:   #00E5FF;
      --green:  #76FF03;
      --orange: #FF6D00;
      --bg:     #111118;
      --surface: #1a1a28;
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Boogaloo', cursive;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* ── Brick background ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        repeating-linear-gradient(
          transparent 0px, transparent 29px,
          rgba(0,0,0,.35) 29px, rgba(0,0,0,.35) 32px
        ),
        repeating-linear-gradient(
          90deg,
          transparent 0px, transparent 59px,
          rgba(0,0,0,.25) 59px, rgba(0,0,0,.25) 62px
        );
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      gap: 2rem;
      padding: 2rem;
    }

    #sidebar {
      width: 280px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: rgba(255,255,255,.03);
      border-left: 1px solid rgba(255,255,255,.08);
      position: relative;
      z-index: 1;
    }

    /* ── Game title ── */
    #title {
      font-family: 'Permanent Marker', cursive;
      font-size: 3.5rem;
      text-align: center;
      line-height: 1;
      color: var(--pink);
      text-shadow: 0 0 40px rgba(255,45,120,.6), 0 4px 0 rgba(0,0,0,.5);
    }

    #subtitle {
      font-family: 'Permanent Marker', cursive;
      font-size: 1.2rem;
      color: var(--cyan);
      text-align: center;
      letter-spacing: .15em;
      text-shadow: 0 0 20px rgba(0,229,255,.5);
    }

    /* ── Player arena ── */
    #arena {
      display: flex;
      gap: 2rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .player-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .75rem;
      padding: 1.5rem 1.25rem 1rem;
      border-radius: 1.5rem;
      min-width: 120px;
      transition: all .3s;
    }

    .player-card .spray-icon {
      font-size: 3.5rem;
      line-height: 1;
    }

    .player-card .player-name {
      font-family: 'Permanent Marker', cursive;
      font-size: 1rem;
      text-align: center;
      word-break: break-word;
      max-width: 120px;
    }

    .player-card .status-badge {
      font-size: .85rem;
      padding: .2rem .75rem;
      border-radius: 99px;
      background: rgba(255,255,255,.1);
    }

    /* ── Waiting state ── */
    #waiting {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .75rem;
    }

    #waiting p {
      font-family: 'Permanent Marker', cursive;
      font-size: 1.5rem;
      color: rgba(255,255,255,.4);
      letter-spacing: .1em;
    }

    .pulse-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--cyan);
      animation: pulse 1.4s ease-in-out infinite;
    }
    .pulse-dot:nth-child(2) { animation-delay: .2s; }
    .pulse-dot:nth-child(3) { animation-delay: .4s; }

    .dots { display: flex; gap: .5rem; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(.8); opacity: .4; }
      40%            { transform: scale(1.2); opacity: 1; }
    }

    /* ── Sidebar ── */
    .sidebar-header {
      padding: 1.25rem 1rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,.08);
      font-family: 'Permanent Marker', cursive;
      font-size: 1.1rem;
      text-align: center;
      color: var(--cyan);
      text-shadow: 0 0 16px rgba(0,229,255,.5);
    }

    #leaderboard {
      flex: 1;
      overflow-y: auto;
      padding: .75rem;
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }

    .lb-row {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .5rem .75rem;
      border-radius: .75rem;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.06);
    }

    .lb-rank { font-family: 'Permanent Marker', cursive; font-size: .85rem; color: rgba(255,255,255,.4); width: 1.5rem; text-align: center; flex-shrink: 0; }
    .lb-name { font-size: .9rem; flex: 1; truncate: true; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-score { font-family: 'Permanent Marker', cursive; font-size: .85rem; flex-shrink: 0; }

    .sidebar-footer {
      padding: .75rem 1rem;
      border-top: 1px solid rgba(255,255,255,.08);
      text-align: center;
    }

    .sidebar-footer p { font-size: .75rem; color: rgba(255,255,255,.25); letter-spacing: .08em; text-transform: uppercase; }
    .sidebar-footer span { font-family: 'Permanent Marker', cursive; font-size: 1.1rem; color: rgba(255,255,255,.5); }

    /* ── Player count ── */
    #player-count {
      font-family: 'Permanent Marker', cursive;
      font-size: 1rem;
      color: rgba(255,255,255,.3);
      letter-spacing: .1em;
    }
  </style>
</head>
<body>

  <!-- Main area -->
  <div id="main">
    <div>
      <div id="title">LAST ONE STANDING</div>
      <div id="subtitle">MIX MASTER ARENA</div>
    </div>

    <div id="arena"></div>

    <div id="waiting">
      <p>WAITING FOR PLAYERS</p>
      <div class="dots">
        <div class="pulse-dot"></div>
        <div class="pulse-dot"></div>
        <div class="pulse-dot"></div>
      </div>
    </div>

    <div id="player-count"></div>
  </div>

  <!-- Sidebar: weekly leaderboard -->
  <aside id="sidebar">
    <div class="sidebar-header">👑 KINGS OF THE WALL</div>
    <div id="leaderboard">
      <p style="text-align:center;color:rgba(255,255,255,.2);font-size:.85rem;padding:1rem 0">No scores yet this week</p>
    </div>
    <div class="sidebar-footer">
      <p>Week resets in</p>
      <span id="countdown">—</span>
    </div>
  </aside>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
