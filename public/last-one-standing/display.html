<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Last One Standing — Mix Master</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Boogaloo&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:    #FF2D78;
      --cyan:    #00E5FF;
      --green:   #76FF03;
      --orange:  #FF6D00;
      --bg:      #111118;
      --surface: #1a1a28;
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Boogaloo', cursive;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        repeating-linear-gradient(transparent 0px, transparent 29px, rgba(0,0,0,.35) 29px, rgba(0,0,0,.35) 32px),
        repeating-linear-gradient(90deg, transparent 0px, transparent 59px, rgba(0,0,0,.25) 59px, rgba(0,0,0,.25) 62px);
      pointer-events: none; z-index: 0;
    }

    /* ── Layout ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      padding: 1.5rem 2rem;
      gap: 1.5rem;
      overflow: hidden;
    }

    #sidebar {
      width: 280px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: rgba(255,255,255,.03);
      border-left: 1px solid rgba(255,255,255,.08);
      position: relative;
      z-index: 1;
    }

    /* ── Title ── */
    #title {
      font-family: 'Permanent Marker', cursive;
      font-size: clamp(2rem, 5vw, 3.5rem);
      text-align: center;
      line-height: 1;
      color: var(--pink);
      text-shadow: 0 0 40px rgba(255,45,120,.6), 0 4px 0 rgba(0,0,0,.5);
    }
    #subtitle {
      font-family: 'Permanent Marker', cursive;
      font-size: 1rem;
      color: var(--cyan);
      text-align: center;
      letter-spacing: .2em;
      text-shadow: 0 0 16px rgba(0,229,255,.5);
    }

    /* ── Round badge ── */
    #round-badge {
      font-family: 'Permanent Marker', cursive;
      font-size: 1rem;
      color: rgba(255,255,255,.4);
      letter-spacing: .15em;
      min-height: 1.5rem;
    }

    /* ── Player arena ── */
    #arena {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      min-height: 180px;
    }

    .player-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .6rem;
      padding: 1.25rem 1rem .9rem;
      border-radius: 1.5rem;
      min-width: 110px;
      transition: all .4s ease;
      position: relative;
    }

    .player-card.alive {
      filter: none;
    }

    .player-card.eliminated {
      filter: grayscale(1) brightness(.4);
      transform: scale(.9);
    }

    .player-card .spray-icon { font-size: 3rem; line-height: 1; position: relative; }

    .player-card .boom {
      position: absolute;
      top: -6px; left: 50%;
      transform: translateX(-50%);
      font-size: 1.8rem;
      animation: boomPop .4s ease-out forwards;
    }

    @keyframes boomPop {
      0%   { transform: translateX(-50%) scale(0); opacity: 1; }
      60%  { transform: translateX(-50%) scale(1.4); }
      100% { transform: translateX(-50%) scale(1.2); opacity: 1; }
    }

    .player-card .player-name {
      font-family: 'Permanent Marker', cursive;
      font-size: .95rem;
      text-align: center;
      max-width: 110px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-card .status-badge {
      font-size: .8rem;
      padding: .15rem .7rem;
      border-radius: 99px;
      background: rgba(255,255,255,.08);
      white-space: nowrap;
    }

    /* ── Waiting ── */
    #waiting {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .6rem;
    }

    #waiting p {
      font-family: 'Permanent Marker', cursive;
      font-size: 1.4rem;
      color: rgba(255,255,255,.35);
      letter-spacing: .1em;
    }

    .dots { display: flex; gap: .5rem; }

    .pulse-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--cyan);
      animation: pulse 1.4s ease-in-out infinite;
    }
    .pulse-dot:nth-child(2) { animation-delay: .2s; }
    .pulse-dot:nth-child(3) { animation-delay: .4s; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(.8); opacity: .35; }
      40%            { transform: scale(1.2); opacity: 1; }
    }

    /* ── Start button ── */
    #start-btn {
      font-family: 'Permanent Marker', cursive;
      font-size: 1.5rem;
      padding: .8rem 3rem;
      border: none;
      border-radius: 1.25rem;
      background: var(--pink);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 0 40px rgba(255,45,120,.55);
      transition: transform .15s, box-shadow .15s;
    }
    #start-btn:hover  { transform: scale(1.04); box-shadow: 0 0 55px rgba(255,45,120,.7); }
    #start-btn:active { transform: scale(.97); }
    #start-btn.hidden { display: none; }

    /* ── Phase overlays ── */
    .phase-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      gap: 1rem;
      pointer-events: none;
    }
    .phase-overlay.hidden { display: none; }

    /* Round start */
    #ph-round {
      background: rgba(0,0,0,.75);
    }
    #ph-round-text {
      font-family: 'Permanent Marker', cursive;
      font-size: clamp(3rem, 10vw, 7rem);
      color: var(--cyan);
      text-shadow: 0 0 60px rgba(0,229,255,.7);
      animation: fadeSlideIn .4s ease-out;
    }
    #ph-round-alive {
      font-family: 'Boogaloo', cursive;
      font-size: 1.5rem;
      color: rgba(255,255,255,.5);
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(-30px) scale(.8); }
      to   { opacity: 1; transform: translateY(0)    scale(1);   }
    }

    /* Countdown */
    #ph-count {
      background: rgba(0,0,0,.6);
    }
    #ph-count-num {
      font-family: 'Permanent Marker', cursive;
      font-size: clamp(8rem, 28vw, 20rem);
      line-height: 1;
      animation: countDrop .55s cubic-bezier(.22,1,.36,1);
    }

    @keyframes countDrop {
      0%   { opacity: 0; transform: scale(2.5); filter: blur(12px); }
      40%  { opacity: 1; filter: blur(0); }
      100% { transform: scale(1); }
    }

    /* TAP! */
    #ph-tap {
      background: rgba(0,0,0,.5);
    }
    #ph-tap-text {
      font-family: 'Permanent Marker', cursive;
      font-size: clamp(6rem, 22vw, 16rem);
      line-height: 1;
      animation: tapExplode .12s ease-out forwards;
      text-shadow: 0 0 80px currentColor, 0 0 160px currentColor;
    }

    @keyframes tapExplode {
      0%   { opacity: 0; transform: scale(.3) rotate(-8deg); }
      60%  { transform: scale(1.12) rotate(2deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    /* FAKE! */
    #ph-fake {
      background: rgba(180,0,0,.55);
    }
    #ph-fake-text {
      font-family: 'Permanent Marker', cursive;
      font-size: clamp(5rem, 18vw, 13rem);
      color: #ff3333;
      text-shadow: 0 0 60px #ff000099;
      animation: fakeShake .5s ease-in-out;
    }
    @keyframes fakeShake {
      0%,100% { transform: translateX(0) rotate(0); }
      15%,55% { transform: translateX(-12px) rotate(-2deg); }
      30%,70% { transform: translateX( 12px) rotate( 2deg); }
      85%     { transform: translateX(-6px) rotate(-1deg); }
    }
    #ph-fake-sub {
      font-family: 'Permanent Marker', cursive;
      font-size: 2rem;
      color: rgba(255,80,80,.9);
      letter-spacing: .1em;
    }

    /* Game over */
    #ph-gameover {
      background: rgba(0,0,0,.88);
      flex-direction: column;
      gap: 1.5rem;
    }
    #confetti-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    #go-winner-name {
      font-family: 'Permanent Marker', cursive;
      font-size: clamp(3rem, 10vw, 7rem);
      animation: fadeSlideIn .5s ease-out;
      text-shadow: 0 0 60px currentColor;
    }
    #go-title {
      font-family: 'Permanent Marker', cursive;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      color: #FFD600;
      text-shadow: 0 0 30px rgba(255,214,0,.6);
      letter-spacing: .1em;
    }
    #go-placements {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      position: relative;
      z-index: 1;
    }
    .go-place {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .3rem;
      padding: .6rem 1rem;
      border-radius: 1rem;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      min-width: 90px;
    }
    .go-place .go-rank { font-size: .85rem; color: rgba(255,255,255,.4); font-family: 'Permanent Marker', cursive; }
    .go-place .go-name { font-family: 'Permanent Marker', cursive; font-size: 1rem; }
    .go-place .go-pts  { font-size: .8rem; color: rgba(255,255,255,.4); }

    /* ── Sidebar ── */
    .sidebar-header {
      padding: 1.25rem 1rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,.08);
      font-family: 'Permanent Marker', cursive;
      font-size: 1.1rem;
      text-align: center;
      color: var(--cyan);
      text-shadow: 0 0 16px rgba(0,229,255,.5);
    }

    #leaderboard {
      flex: 1;
      overflow-y: auto;
      padding: .75rem;
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }

    .lb-row {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .5rem .75rem;
      border-radius: .75rem;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.06);
    }
    .lb-rank  { font-family: 'Permanent Marker', cursive; font-size: .85rem; color: rgba(255,255,255,.4); width: 1.5rem; text-align: center; flex-shrink: 0; }
    .lb-name  { font-size: .9rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-score { font-family: 'Permanent Marker', cursive; font-size: .85rem; flex-shrink: 0; }

    .sidebar-footer {
      padding: .75rem 1rem;
      border-top: 1px solid rgba(255,255,255,.08);
      text-align: center;
    }
    .sidebar-footer p    { font-size: .75rem; color: rgba(255,255,255,.25); text-transform: uppercase; letter-spacing: .08em; }
    .sidebar-footer span { font-family: 'Permanent Marker', cursive; font-size: 1.1rem; color: rgba(255,255,255,.5); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Main -->
  <div id="main">

    <div>
      <div id="title">LAST ONE STANDING</div>
      <div id="subtitle">MIX MASTER ARENA</div>
    </div>

    <div id="round-badge"></div>

    <!-- Player arena (always visible) -->
    <div id="arena"></div>

    <!-- Waiting for players -->
    <div id="waiting">
      <p>WAITING FOR PLAYERS</p>
      <div class="dots">
        <div class="pulse-dot"></div>
        <div class="pulse-dot"></div>
        <div class="pulse-dot"></div>
      </div>
    </div>

    <!-- Start button -->
    <button id="start-btn" class="hidden">▶ START GAME</button>

    <!-- ── Phase overlays ── -->

    <!-- Round start -->
    <div id="ph-round" class="phase-overlay hidden">
      <div id="ph-round-text"></div>
      <div id="ph-round-alive"></div>
    </div>

    <!-- Countdown -->
    <div id="ph-count" class="phase-overlay hidden">
      <div id="ph-count-num"></div>
    </div>

    <!-- TAP! -->
    <div id="ph-tap" class="phase-overlay hidden">
      <div id="ph-tap-text">TAP!</div>
    </div>

    <!-- FAKE! -->
    <div id="ph-fake" class="phase-overlay hidden">
      <div id="ph-fake-text">⚠️ FAKE!</div>
      <div id="ph-fake-sub">DON'T TAP!</div>
    </div>

    <!-- Game over -->
    <div id="ph-gameover" class="phase-overlay hidden">
      <canvas id="confetti-canvas"></canvas>
      <div id="go-title">🏆 CHAMPION!</div>
      <div id="go-winner-name"></div>
      <div id="go-placements"></div>
    </div>

  </div>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">👑 KINGS OF THE WALL</div>
    <div id="leaderboard">
      <p style="text-align:center;color:rgba(255,255,255,.2);font-size:.85rem;padding:1rem 0">No scores yet this week</p>
    </div>
    <div class="sidebar-footer">
      <p>Week resets in</p>
      <span id="week-countdown">—</span>
    </div>
  </aside>

  <script>
    // Platform URL passed as ?platform=... query param by the host platform iframe.
    // game.js reads window.__PLATFORM_URL for the leaderboard API call.
    window.__PLATFORM_URL = new URLSearchParams(window.location.search).get('platform')
      || 'https://mix-master-gray.vercel.app';
  </script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
